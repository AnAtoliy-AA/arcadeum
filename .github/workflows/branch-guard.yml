name: Branch Guard

permissions: read-all

on:
  pull_request:
    branches: [main, staging]
  push:
    branches-ignore:
      - main
      - develop
  workflow_dispatch:
    inputs:
      pr_title:
        description: 'PR title to validate (leave empty to auto-detect from the open PR on the selected branch)'
        required: false
        default: ''
      target_branch:
        description: 'Target branch (main or staging). Leave empty to auto-detect.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check-pr-title:
    # NOTE: no `name:` here on purpose. The required status check configured in
    # the ruleset references the job id `check-pr-title`, and GitHub matches
    # required checks against the check run name (job id when name is unset).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR title and target branch
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_TITLE=0
          HAS_BASE=0
          [ -n "${{ inputs.pr_title }}" ] && HAS_TITLE=1
          [ -n "${{ inputs.target_branch }}" ] && HAS_BASE=1

          if [ "$HAS_TITLE" = "1" ] && [ "$HAS_BASE" = "1" ]; then
            echo "title=${{ inputs.pr_title }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_TITLE" = "1" ] || [ "$HAS_BASE" = "1" ]; then
            echo "::error::Provide both pr_title and target_branch inputs, or neither to auto-detect."
            exit 1
          fi

          BRANCH="${{ github.ref_name }}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::error::No open PR found for branch '$BRANCH'. Provide pr_title and target_branch inputs, or run the workflow on the PR head branch."
            exit 1
          fi
          echo "title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')" >> "$GITHUB_OUTPUT"
          echo "base=$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')" >> "$GITHUB_OUTPUT"

      - name: Check PR title prefix matches target branch
        env:
          TITLE: ${{ steps.resolve.outputs.title }}
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          if [[ "$BASE" == "staging" ]]; then
            if [[ ! "$TITLE" =~ ^[Dd]emo ]]; then
              echo "❌ PR title must start with 'demo' to merge to staging."
              echo "   Got: $TITLE"
              exit 1
            fi
          elif [[ "$BASE" == "main" ]]; then
            if [[ ! "$TITLE" =~ ^[Rr]elease ]]; then
              echo "❌ PR title must start with 'release' to merge to main."
              echo "   Got: $TITLE"
              exit 1
            fi
          fi
          echo "✅ PR title OK: $TITLE"

  detect-dropped-commits:
    name: Verify push preserves history
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the previous tip is still reachable
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push of $REF — nothing to compare. OK."
            exit 0
          fi
          if [[ "$AFTER"  == "0000000000000000000000000000000000000000" ]]; then
            echo "Branch deletion of $REF — nothing to compare. OK."
            exit 0
          fi

      - name: Checkout enough history to walk both tips
        uses: actions/checkout@v7
        if: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.after != '0000000000000000000000000000000000000000' }}
        with:
          fetch-depth: 0

      - name: Fail if the force-push removed commits
        if: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.after != '0000000000000000000000000000000000000000' }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
        run: |
          git fetch --no-tags --quiet origin "$BEFORE" || true
          git fetch --no-tags --quiet origin "$AFTER"  || true

          if git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "Push to $REF is a fast-forward — all previous commits preserved. OK."
            exit 0
          fi

          echo "::error::Push to $REF dropped commits."
          echo "Previous tip $BEFORE is no longer reachable from new tip $AFTER."
          echo ""
          echo "Commits that existed on $REF before this push and are now gone:"
          git log --oneline "$AFTER..$BEFORE" || true
          echo ""
          echo "If this was intentional (e.g. rebase, squash), open a PR from"
          echo "the new branch instead of force-pushing over an existing branch"
          echo "with an open PR — the merge will otherwise silently drop the"
          echo "missing commits when GitHub merges."
          exit 1
