name: Changelog Check

permissions: read-all

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check-changelog:
    name: Verify CHANGELOG.md updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG.md was modified
        id: changelog
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          if git diff --name-only "$BASE" "$HEAD" | grep -q "^CHANGELOG.md$"; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md was modified."
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "CHANGELOG.md was NOT modified."
          fi

      - name: Check PR title for breaking/feature
        id: title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qE "^(feat|fix|breaking)"; then
            echo "needs_changelog=true" >> $GITHUB_OUTPUT
            echo "PR title suggests user-facing change: $TITLE"
          else
            echo "needs_changelog=false" >> $GITHUB_OUTPUT
            echo "PR title does not require changelog: $TITLE"
          fi

      - name: Warn if changelog missing
        if: steps.title.outputs.needs_changelog == 'true' && steps.changelog.outputs.updated == 'false'
        run: |
          echo "::warning::This PR includes a feat/fix/breaking change but CHANGELOG.md was not updated. Please add an entry if this is a user-facing change."
