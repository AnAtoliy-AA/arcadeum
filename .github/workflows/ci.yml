name: CI

permissions: read-all

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true
  MONGODB_OCI_URI: mongodb://localhost:27017/arcadeum_test
  AUTH_JWT_SECRET: test_secret
  NEXT_PUBLIC_E2E: true
  NEXT_PUBLIC_AUTH_WEB_CLIENT_ID: dummy-client-id
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_PRESENTATION_VIDEO_ID: dQw4w9WgXcQ
  NEXT_PUBLIC_SOCIAL_LINKEDIN: https://linkedin.com/company/arcadeum
  NEXT_PUBLIC_SOCIAL_X: https://x.com/arcadeum
  NEXT_PUBLIC_SOCIAL_INSTAGRAM: https://instagram.com/arcadeum
  NEXT_PUBLIC_SOCIAL_DISCORD: https://discord.gg/arcadeum

# Skip heavy work on version-bump pushes (skipped jobs still satisfy required
# checks, unlike commits using [skip ci] which leave them pending forever).
# PR events always run in full.
jobs:
  build:
    name: Build
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm exec turbo run build --filter web --filter be

      - name: Bundle Build Artifacts
        run: tar -cvf build-artifacts.tar apps/web/.next apps/web/public/build-id.json apps/web/public/game-sizes.json apps/be/dist packages/games-core/dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: build-artifacts.tar
          retention-days: 1

  test-backend:
    name: Backend Tests
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Unit Tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm exec turbo run test --filter be --log-order=stream -- --forceExit --detectOpenHandles --passWithNoTests

      - name: Run Backend E2E Tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm --filter be test:e2e

  docs-links:
    name: Documentation Links
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Documentation Link Checker
        run: pnpm docs:check

  lint-and-test-unit:
    name: Lint & Unit Tests
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run Web Unit Tests
        run: pnpm exec turbo run test --filter web --log-order=stream -- --passWithNoTests

      - name: Run Mobile Unit Tests
        run: pnpm exec turbo run test --filter mobile --log-order=stream -- --passWithNoTests

  web-e2e:
    name: Web E2E (${{ matrix.project }}, Shard ${{ matrix.shard }}/2)
    needs: build
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, "Mobile Chrome", "Mobile Safari", "Tablet Safari"]
        shard: [1, 2]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      E2E_PROD: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Verify Builds
        run: |
          ls -F apps/web/.next | head -n 5
          ls -F apps/be/dist | head -n 5

      - name: Determine Browser Engine
        id: engine
        run: |
          if [[ "${{ matrix.project }}" == "chromium" || "${{ matrix.project }}" == "Mobile Chrome" ]]; then
            echo "browser=chromium" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.project }}" == "firefox" ]]; then
            echo "browser=firefox" >> $GITHUB_OUTPUT
          else
            echo "browser=webkit" >> $GITHUB_OUTPUT
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.engine.outputs.browser }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.engine.outputs.browser }}-

      - name: Disable Broken Microsoft Repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.sources
          sudo apt-get update || true

      - name: Install Playwright System Dependencies
        run: pnpm --filter web exec playwright install-deps ${{ steps.engine.outputs.browser }}

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install ${{ steps.engine.outputs.browser }}

      - name: Run Web E2E Tests
        run: pnpm --filter web test:e2e --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/2

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
          retention-days: 30
