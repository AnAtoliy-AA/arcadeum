name: CI

permissions: read-all

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop, staging ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MONGODB_OCI_URI: mongodb://localhost:27017/arcadeum_test
  AUTH_JWT_SECRET: test_secret
  NEXT_PUBLIC_E2E: true
  NEXT_PUBLIC_AUTH_WEB_CLIENT_ID: dummy-client-id
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_PRESENTATION_VIDEO_ID: dQw4w9WgXcQ
  NEXT_PUBLIC_SOCIAL_LINKEDIN: https://linkedin.com/company/arcadeum
  NEXT_PUBLIC_SOCIAL_X: https://x.com/arcadeum
  NEXT_PUBLIC_SOCIAL_INSTAGRAM: https://instagram.com/arcadeum
  NEXT_PUBLIC_SOCIAL_DISCORD: https://discord.gg/arcadeum

# Skip heavy work on version-bump pushes (skipped jobs still satisfy required
# checks, unlike commits using [skip ci] which leave them pending forever).
# PR events always run in full.
jobs:
  build:
    name: Build
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm exec turbo run build --filter web --filter be

      - name: Bundle Build Artifacts
        run: tar -cvf build-artifacts.tar apps/web/.next apps/web/public/build-id.json apps/web/public/game-sizes.json apps/be/dist packages/games-core/dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs
          path: build-artifacts.tar
          retention-days: 1

  test-backend:
    name: Backend Tests
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Unit Tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm exec turbo run test --filter be --log-order=stream -- --forceExit --detectOpenHandles --passWithNoTests

      - name: Run Backend E2E Tests
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm --filter be test:e2e --forceExit

  docs-links:
    name: Documentation Links
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Documentation Link Checker
        run: pnpm docs:check

  lint-and-test-unit:
    name: Lint & Unit Tests
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm run lint

      - name: Run Web Unit Tests
        run: pnpm exec turbo run test --filter web --log-order=stream -- --passWithNoTests

      - name: Run Mobile Unit Tests
        run: pnpm exec turbo run test --filter mobile --log-order=stream -- --passWithNoTests

  web-e2e:
    name: Web E2E (${{ matrix.project }}, Shard ${{ matrix.shard }}/3)
    needs: build
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version')) }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'develop' && '[]' || '["chromium", "firefox", "webkit", "Mobile Chrome", "Mobile Safari", "Tablet Safari"]') }}
        shard: [1, 2, 3]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      E2E_PROD: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Verify Builds
        run: |
          ls -F apps/web/.next | head -n 5
          ls -F apps/be/dist | head -n 5

      - name: Determine Browser Engine
        id: engine
        run: |
          if [[ "${{ matrix.project }}" == "chromium" || "${{ matrix.project }}" == "Mobile Chrome" ]]; then
            echo "browser=chromium" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.project }}" == "firefox" ]]; then
            echo "browser=firefox" >> $GITHUB_OUTPUT
          else
            echo "browser=webkit" >> $GITHUB_OUTPUT
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.engine.outputs.browser }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.engine.outputs.browser }}-

      - name: Disable Broken Microsoft Repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.sources
          sudo apt-get update || true

      - name: Install Playwright System Dependencies
        run: pnpm --filter web exec playwright install-deps ${{ steps.engine.outputs.browser }}

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install ${{ steps.engine.outputs.browser }}

      - name: Run Web E2E Tests
        run: pnpm --filter web test:e2e --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/3

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
          retention-days: 30

  web-e2e-develop:
    name: Web E2E (${{ matrix.project }}, Shard ${{ matrix.shard }}/6)
    needs: build
    if: "${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && !startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version') }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ['chromium']
        shard: [1, 2, 3, 4, 5, 6]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      E2E_PROD: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Verify Builds
        run: |
          ls -F apps/web/.next | head -n 5
          ls -F apps/be/dist | head -n 5

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Disable Broken Microsoft Repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.sources
          sudo apt-get update || true

      - name: Install Playwright System Dependencies
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install chromium

      - name: Run Web E2E Tests
        run: pnpm --filter web test:e2e --project=chromium --shard=${{ matrix.shard }}/6

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report-chromium-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
          retention-days: 30

  lhci-urls:
    name: Generate Lighthouse URLs
    needs: build
    if: "${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Generate Lighthouse URLs from routes
        run: node apps/web/scripts/generate-lhci-urls.mjs

      - name: Upload Lighthouse URLs
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-urls
          path: apps/web/lighthouse-urls.json
          retention-days: 1

  lhci-audit:
    name: Lighthouse (Shard ${{ matrix.shard }}/8)
    needs: [build, lhci-urls]
    if: "${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    env:
      MONGODB_OCI_URI: mongodb://localhost:27017/arcadeum_test
      AUTH_JWT_SECRET: lighthouse_test_secret
      OAUTH_WEB_CLIENT_ID: lighthouse_dummy_client_id
      OAUTH_WEB_CLIENT_SECRET: lighthouse_dummy_client_secret
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Start Backend server
        run: |
          pnpm --filter be start:prod &
          for i in $(seq 1 60); do
            if curl -s http://localhost:4000/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Start Next.js server
        run: |
          pnpm --filter web start &
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/en > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Download Lighthouse URLs
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-urls
          path: apps/web/

      - name: Shard URLs
        run: |
          node -e "
            const urls = require('./apps/web/lighthouse-urls.json');
            const shard = ${{ matrix.shard }};
            const total = 8;
            const shardUrls = urls.filter((_, i) => i % total === shard - 1);
            require('fs').writeFileSync('./apps/web/lighthouse-urls.json', JSON.stringify(shardUrls, null, 2));
            console.log('Shard ' + shard + ': ' + shardUrls.length + ' URLs');
          "

      - name: Run Lighthouse CI
        run: pnpm --filter web lhci

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ matrix.shard }}
          path: .lighthouseci/
          retention-days: 1

      - name: Clean up Lighthouse reports
        if: always()
        run: rm -rf .lighthouseci/

  lhci-comment:
    name: Lighthouse Report
    needs: lhci-audit
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Reports
        uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-reports-*
          merge-multiple: true
          path: .lighthouseci/

      - name: Post PR comment
        run: node scripts/lhci-comment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  axe-a11y:
    name: axe-a11y (Shard ${{ matrix.shard }}/2)
    needs: [build, lhci-urls]
    if: "${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-outputs

      - name: Extract Build Artifacts
        run: tar -xvf build-artifacts.tar

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Disable Broken Microsoft Repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.sources
          sudo apt-get update || true

      - name: Install Playwright System Dependencies
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install chromium

      - name: Download Lighthouse URLs
        uses: actions/download-artifact@v8
        with:
          name: lighthouse-urls
          path: apps/web/

      - name: Run axe-a11y Tests
        run: pnpm --filter web test:e2e --project=chromium e2e/audit/axe-a11y.spec.ts
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: '2'
          E2E_PROD: 'true'

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-a11y-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7
