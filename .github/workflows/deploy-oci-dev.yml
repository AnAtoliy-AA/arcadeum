name: Deploy to OCI (Dev)

permissions: read-all

concurrency:
  group: deploy-oci-dev
  cancel-in-progress: false

on:
  push:
    branches: [staging]
    paths:
      - 'apps/be/**'
      - 'bots/tg-bot/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch override (leave empty to use the branch selected in the Run workflow dropdown)'
        required: false
        default: ''

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      be-or-tg: ${{ steps.filter.outputs.be-or-tg }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            be-or-tg:
              - 'apps/be/**'
              - 'bots/tg-bot/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  deploy-be-and-tg-bot:
    name: Deploy BE + TG Bot (Dev)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.be-or-tg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            exec 200>/tmp/arcadeum-dev-deploy.lock
            flock -x 200
            DEPLOY_DIR="/opt/arcadeum-dev"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R ubuntu:ubuntu "$DEPLOY_DIR"
              git clone --depth 1 -b staging https://github.com/AnAtoliy-AA/arcadeum.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            BRANCH="${{ inputs.branch || github.ref_name }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            pnpm install --frozen-lockfile

            pnpm --filter @arcadeum/games-core build && pnpm --filter be build
            pnpm --filter tg-bot build

            # Stockfish 19 — skip download if binary already present
            # Service checks /usr/local/bin/stockfish first (Docker path),
            # then falls back to apps/be/bin/stockfish (local dev path).
            SF_BIN="/usr/local/bin/stockfish"
            if [ ! -x "$SF_BIN" ]; then
              echo "==> Downloading Stockfish 19 (Linux x86-64)..."
              curl -L -o /tmp/sf19.tar.gz \
                "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz"
              mkdir -p /tmp/sf19-extract
              tar -xzf /tmp/sf19.tar.gz -C /tmp/sf19-extract
              find /tmp/sf19-extract -name "stockfish*" -type f -executable -exec sudo cp {} "$SF_BIN" \; 2>/dev/null || \
                find /tmp/sf19-extract -name "stockfish*" -type f -executable -exec cp {} "$SF_BIN" \;
              sudo chmod +x "$SF_BIN" 2>/dev/null || chmod +x "$SF_BIN"
              rm -rf /tmp/sf19.tar.gz /tmp/sf19-extract
              if [ ! -x "$SF_BIN" ]; then
                echo "ERROR: Stockfish binary not found or not executable at $SF_BIN"
                exit 1
              fi
              echo "uci" | "$SF_BIN" 2>/dev/null | head -1
              echo "==> Stockfish 19 installed."
            else
              echo "==> Stockfish 19 binary already present, skipping download."
            fi

            mkdir -p "${DEPLOY_DIR}/scripts"

            printf '#!/usr/bin/env bash\nset -a\nsource /opt/arcadeum-dev/apps/be/.env.dev\nset +a\ncd /opt/arcadeum-dev\nexec node apps/be/dist/src/main.js\n' > "${DEPLOY_DIR}/scripts/start-be-dev.sh"
            chmod +x "${DEPLOY_DIR}/scripts/start-be-dev.sh"

            printf '#!/usr/bin/env bash\nset -a\nsource /opt/arcadeum-dev/apps/tg-bot/.env.dev\nset +a\ncd /opt/arcadeum-dev\nexec node bots/tg-bot/dist/src/main.js\n' > "${DEPLOY_DIR}/scripts/start-tg-bot-dev.sh"
            chmod +x "${DEPLOY_DIR}/scripts/start-tg-bot-dev.sh"

            pm2 restart arcadeum-be-dev || pm2 start "${DEPLOY_DIR}/scripts/start-be-dev.sh" --name arcadeum-be-dev
            pm2 restart arcadeum-tg-bot-dev || pm2 start "${DEPLOY_DIR}/scripts/start-tg-bot-dev.sh" --name arcadeum-tg-bot-dev
            pm2 save

            echo "==> Dev deploy done (branch: $BRANCH)!"
            pm2 list

  deploy-web:
    name: Deploy Web (Dev, Next.js standalone)
    needs: [changes, deploy-be-and-tg-bot]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            exec 200>/tmp/arcadeum-dev-deploy.lock
            flock -x 200
            DEPLOY_DIR="/opt/arcadeum-dev"
            WEB_PORT=3001
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            BRANCH="${{ inputs.branch || github.ref_name }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            WEB_ENV="$DEPLOY_DIR/apps/web/.env.dev"
            if [ ! -f "$WEB_ENV" ]; then
              echo "ERROR: $WEB_ENV is missing. Create it on the server first (NEXT_PUBLIC_* values are inlined at build time)."
              exit 1
            fi

            pnpm install --frozen-lockfile

            # Load staging env so NEXT_PUBLIC_* are baked into the build
            set -a; source "$WEB_ENV"; set +a
            pnpm --filter @arcadeum/games-core build
            (cd apps/web && pnpm build)

            # Copy static assets + public into standalone output
            STANDALONE="apps/web/.next/standalone/apps/web"
            cp -r apps/web/.next/static "$STANDALONE/.next/static"
            cp -r apps/web/public "$STANDALONE/public" 2>/dev/null || true

            mkdir -p "${DEPLOY_DIR}/scripts"
            printf '#!/usr/bin/env bash\nset -a\nsource /opt/arcadeum-dev/apps/web/.env.dev\nset +a\nexport PORT=%s HOSTNAME=0.0.0.0\ncd /opt/arcadeum-dev/apps/web/.next/standalone/apps/web\nexec node server.js\n' "$WEB_PORT" > "${DEPLOY_DIR}/scripts/start-web-dev.sh"
            chmod +x "${DEPLOY_DIR}/scripts/start-web-dev.sh"

            pm2 restart arcadeum-web-dev --update-env || pm2 start "${DEPLOY_DIR}/scripts/start-web-dev.sh" --name arcadeum-web-dev
            pm2 save

            echo "==> Dev web deploy done (branch: $BRANCH, port: $WEB_PORT)!"
            pm2 list arcadeum-web-dev
