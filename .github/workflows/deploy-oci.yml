name: Deploy to OCI (Prod)

permissions: read-all

on:
  push:
    branches: [main]
    paths:
      - 'apps/be/**'
      - 'apps/web/**'
      - 'bots/tg-bot/**'
      - 'bots/task-bot/**'
      - 'scripts/shorts-factory/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      be-or-tg: ${{ steps.filter.outputs.be-or-tg }}
      web: ${{ steps.filter.outputs.web }}
      task-bot: ${{ steps.filter.outputs.task-bot }}
      shorts-factory: ${{ steps.filter.outputs.shorts-factory }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            be-or-tg:
              - 'apps/be/**'
              - 'bots/tg-bot/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
            task-bot:
              - 'bots/task-bot/**'
            shorts-factory:
              - 'scripts/shorts-factory/**'

  deploy-web:
    name: Deploy Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            echo "==> Cleaning git state..."
            rm -f "$DEPLOY_DIR/.git/index.lock"
            git reset --hard HEAD 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              git gc --prune=now 2>/dev/null || true
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            pnpm install --frozen-lockfile

            cd apps/web
            pnpm build

            # Copy static assets + public into standalone output
            STANDALONE=".next/standalone/apps/web"
            cp -r .next/static "$STANDALONE/.next/static"
            cp -r public "$STANDALONE/public" 2>/dev/null || true

            cd "$DEPLOY_DIR"
            pm2 restart arcadeum-web

            echo "==> Web deploy done (branch: $BRANCH)!"
            pm2 list arcadeum-web

  deploy-tg-bot:
    name: Deploy TG Bot + Backend (Docker)
    needs: changes
    if: needs.changes.outputs.be-or-tg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            echo "==> Cleaning git state..."
            rm -f "$DEPLOY_DIR/.git/index.lock"
            git reset --hard HEAD 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              git gc --prune=now 2>/dev/null || true
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            echo "==> Stopping old pm2 processes (ports 4000/4001 conflict with Docker)..."
            pm2 delete arcadeum-be 2>/dev/null || true
            pm2 delete arcadeum-be-dev 2>/dev/null || true
            pm2 delete arcadeum-tg-bot 2>/dev/null || true
            pm2 delete arcadeum-tg-bot-dev 2>/dev/null || true
            pm2 save 2>/dev/null || true

            echo "==> Installing Docker Compose plugin + buildx (if missing)..."
            if ! docker compose version &>/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-plugin
              echo "==> Docker Compose plugin installed"
            fi
            if ! docker buildx version &>/dev/null; then
              mkdir -p ~/.docker/cli-plugins
              BUILDX_URL="https://github.com/docker/buildx/releases/latest/download/docker-buildx-$(uname -s)-$(uname -m)"
              curl -sSL -o ~/.docker/cli-plugins/docker-buildx "$BUILDX_URL" && chmod +x ~/.docker/cli-plugins/docker-buildx
              echo "==> Docker buildx installed"
            fi

            echo "==> Building and deploying with Docker Compose..."
            docker compose build be be-2 worker tg-bot
            docker compose up -d --remove-orphans

            echo "==> Waiting for health checks..."
            sleep 10

            echo "==> Starting monitoring stack..."
            if [ -f monitoring/.env.monitoring ]; then
              docker compose -f docker-compose.monitoring.yml up -d --remove-orphans
              echo "==> Monitoring stack started"
            else
              echo "==> Skipping monitoring (monitoring/.env.monitoring not found)"
            fi

            echo "==> Container status:"
            docker compose ps
            docker compose -f docker-compose.monitoring.yml ps 2>/dev/null || true

            echo "==> Prod deploy done (branch: $BRANCH)!"

  deploy-be-reserve:
    name: Deploy Reserve Backend (Worker)
    needs: changes
    if: needs.changes.outputs.be-or-tg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_WORKER_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_WORKER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            echo "==> Cleaning git state..."
            rm -f "$DEPLOY_DIR/.git/index.lock"
            git reset --hard HEAD 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              git gc --prune=now 2>/dev/null || true
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            pnpm install --frozen-lockfile
            pnpm --filter @arcadeum/games-core build && pnpm --filter be build

            if [ ! -f "$DEPLOY_DIR/apps/be/dist/src/main.js" ]; then
              echo "ERROR: BE build did not produce dist/src/main.js"
              exit 1
            fi

            # Stockfish 19 — skip download if binary already present
            SF_BIN="/usr/local/bin/stockfish"
            if [ ! -x "$SF_BIN" ]; then
              ARCH=$(uname -m)
              case "$ARCH" in
                aarch64) SF_ASSET="stockfish-linux-arm64-universal.tar.gz" ;;
                x86_64)  SF_ASSET="stockfish-linux-x86-64-universal.tar.gz" ;;
                *)       echo "ERROR: unsupported arch $ARCH for Stockfish"; exit 1 ;;
              esac
              echo "==> Downloading Stockfish 19 ($ARCH)..."
              curl -L -o /tmp/sf19.tar.gz \
                "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/$SF_ASSET"
              mkdir -p /tmp/sf19-extract
              tar -xzf /tmp/sf19.tar.gz -C /tmp/sf19-extract
              find /tmp/sf19-extract -name "stockfish" -type f -executable -exec cp {} "$SF_BIN" \;
              chmod +x "$SF_BIN"
              rm -rf /tmp/sf19.tar.gz /tmp/sf19-extract
              "$SF_BIN" <<< "uci" 2>/dev/null | head -1
              echo "==> Stockfish 19 installed."
            else
              echo "==> Stockfish 19 binary already present, skipping download."
            fi

            mkdir -p "$DEPLOY_DIR/scripts"
            printf '#!/usr/bin/env bash\nset -a\nsource /opt/arcadeum/apps/be/.env\nset +a\ncd /opt/arcadeum\nexec node apps/be/dist/src/worker.js\n' > "$DEPLOY_DIR/scripts/start-be-reserve.sh"
            chmod +x "$DEPLOY_DIR/scripts/start-be-reserve.sh"

            pm2 restart arcadeum-be-reserve || \
              pm2 start "$DEPLOY_DIR/scripts/start-be-reserve.sh" --name arcadeum-be-reserve

            pm2 save

            echo "==> Reserve BE deploy done (branch: $BRANCH)!"
            pm2 list

  deploy-task-bot:
    name: Deploy Task Bot
    needs: changes
    if: needs.changes.outputs.task-bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"

            echo "==> Cleaning git state..."
            rm -f "$DEPLOY_DIR/.git/index.lock"
            git -C "$DEPLOY_DIR" reset --hard HEAD 2>/dev/null || true
            git -C "$DEPLOY_DIR" gc --prune=now 2>/dev/null || true

            cd "$DEPLOY_DIR/bots/task-bot"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git -C "$DEPLOY_DIR" fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              git -C "$DEPLOY_DIR" gc --prune=now 2>/dev/null || true
              sleep 5
            done
            git -C "$DEPLOY_DIR" reset --hard "origin/$BRANCH"

            cd "$DEPLOY_DIR/bots/task-bot"
            pnpm build || npx tsc

            sudo chown -R ubuntu:ubuntu /opt/arcadeum/pending 2>/dev/null || true
            sudo chmod -R 777 /opt/arcadeum/pending 2>/dev/null || true

            pm2 restart task-bot || \
              (pm2 start dist/main.js --name task-bot --cwd "$DEPLOY_DIR/bots/task-bot" && \
               pm2 save)

            echo "==> Task Bot deployed (branch: $BRANCH)!"
            pm2 list

  deploy-shorts-factory:
    name: Deploy Shorts Factory
    needs: changes
    if: needs.changes.outputs.shorts-factory == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/arcadeum

            echo "==> Cleaning git state..."
            rm -f /opt/arcadeum/.git/index.lock
            git reset --hard HEAD 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            echo "==> Pulling latest code (branch: $BRANCH)..."
            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f /opt/arcadeum/.git/index.lock
              git gc --prune=now 2>/dev/null || true
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            echo "==> Installing dependencies..."
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install

            echo "==> Installing Playwright browsers..."
            npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium
            sudo npx playwright install chromium 2>/dev/null || true

            echo "==> Creating directories and setting permissions..."
            mkdir -p raw_captures output pending
            sudo chown -R ubuntu:ubuntu /opt/arcadeum/pending 2>/dev/null || true
            sudo chmod -R 777 /opt/arcadeum/pending 2>/dev/null || true

            echo "==> Ensuring shorts-factory wrapper script exists..."
            if [ ! -f /opt/arcadeum/scripts/shorts-factory-random.sh ]; then
              sudo tee /opt/arcadeum/scripts/shorts-factory-random.sh > /dev/null <<'WRAPPER'
            #!/usr/bin/env bash
            DELAY=$(( RANDOM % 7200 ))
            echo "[$(date)] Waiting ${DELAY} seconds before running shorts factory..."
            sleep $DELAY
            cd /opt/arcadeum
            exec node scripts/shorts-factory/factory.js
            WRAPPER
              sudo chmod +x /opt/arcadeum/scripts/shorts-factory-random.sh
              echo "Created shorts-factory-random.sh"
            fi

            echo "==> Restarting shorts-factory timer..."
            sudo systemctl restart shorts-factory.timer 2>/dev/null || true

            echo "==> Deploy complete"
