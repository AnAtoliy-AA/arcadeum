name: Deploy to OCI (Prod)

on:
  push:
    branches: [main]
    paths:
      - 'apps/be/**'
      - 'apps/web/**'
      - 'bots/tg-bot/**'
      - 'bots/task-bot/**'
      - 'scripts/shorts-factory/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      be-or-tg: ${{ steps.filter.outputs.be-or-tg }}
      web: ${{ steps.filter.outputs.web }}
      task-bot: ${{ steps.filter.outputs.task-bot }}
      shorts-factory: ${{ steps.filter.outputs.shorts-factory }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be-or-tg:
              - 'apps/be/**'
              - 'bots/tg-bot/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
            task-bot:
              - 'bots/task-bot/**'
            shorts-factory:
              - 'scripts/shorts-factory/**'

  deploy-web:
    name: Deploy Web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            pnpm install --frozen-lockfile

            cd apps/web
            pnpm build

            # Copy static assets + public into standalone output
            STANDALONE=".next/standalone/apps/web"
            cp -r .next/static "$STANDALONE/.next/static"
            cp -r public "$STANDALONE/public" 2>/dev/null || true

            cd "$DEPLOY_DIR"
            pm2 restart arcadeum-web

            echo "==> Web deploy done (branch: $BRANCH)!"
            pm2 list arcadeum-web

  deploy-tg-bot:
    name: Deploy TG Bot + Backend (Docker)
    needs: changes
    if: needs.changes.outputs.be-or-tg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            echo "==> Building and deploying with Docker Compose..."
            docker compose build be be-2 worker tg-bot
            docker compose up -d --remove-orphans

            echo "==> Waiting for health checks..."
            sleep 10

            echo "==> Container status:"
            docker compose ps

            echo "==> Prod deploy done (branch: $BRANCH)!"

  deploy-be-reserve:
    name: Deploy Reserve Backend (Worker - Docker)
    needs: changes
    if: needs.changes.outputs.be-or-tg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_WORKER_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_WORKER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            echo "==> Building and deploying worker with Docker Compose..."
            docker compose build worker
            docker compose up -d worker --remove-orphans

            echo "==> Waiting for health check..."
            sleep 5

            echo "==> Worker container status:"
            docker compose ps worker

            echo "==> Reserve BE deploy done (branch: $BRANCH)!"

  deploy-task-bot:
    name: Deploy Task Bot
    needs: changes
    if: needs.changes.outputs.task-bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            cd "$DEPLOY_DIR/bots/task-bot"

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            for attempt in 1 2 3; do
              if git -C "$DEPLOY_DIR" fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f "$DEPLOY_DIR/.git/index.lock"
              sleep 5
            done
            git -C "$DEPLOY_DIR" reset --hard "origin/$BRANCH"

            cd "$DEPLOY_DIR/bots/task-bot"
            pnpm build || npx tsc

            sudo chown -R ubuntu:ubuntu /opt/arcadeum/pending 2>/dev/null || true
            sudo chmod -R 777 /opt/arcadeum/pending 2>/dev/null || true

            pm2 restart task-bot || \
              (pm2 start dist/main.js --name task-bot --cwd "$DEPLOY_DIR/bots/task-bot" && \
               pm2 save)

            echo "==> Task Bot deployed (branch: $BRANCH)!"
            pm2 list

  deploy-shorts-factory:
    name: Deploy Shorts Factory
    needs: changes
    if: needs.changes.outputs.shorts-factory == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/arcadeum

            rm -f /opt/arcadeum/.git/index.lock

            BRANCH="${{ github.event.inputs.branch || 'main' }}"

            echo "==> Pulling latest code (branch: $BRANCH)..."
            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH"; then
                break
              fi
              echo "==> Git fetch failed (attempt $attempt), retrying in 5s..."
              rm -f /opt/arcadeum/.git/index.lock
              sleep 5
            done
            git reset --hard "origin/$BRANCH"

            echo "==> Installing dependencies..."
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install

            echo "==> Installing Playwright browsers..."
            npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium
            sudo npx playwright install chromium 2>/dev/null || true

            echo "==> Creating directories and setting permissions..."
            mkdir -p raw_captures output pending
            sudo chown -R ubuntu:ubuntu /opt/arcadeum/pending 2>/dev/null || true
            sudo chmod -R 777 /opt/arcadeum/pending 2>/dev/null || true

            echo "==> Ensuring shorts-factory wrapper script exists..."
            if [ ! -f /opt/arcadeum/scripts/shorts-factory-random.sh ]; then
              sudo tee /opt/arcadeum/scripts/shorts-factory-random.sh > /dev/null <<'WRAPPER'
            #!/usr/bin/env bash
            DELAY=$(( RANDOM % 7200 ))
            echo "[$(date)] Waiting ${DELAY} seconds before running shorts factory..."
            sleep $DELAY
            cd /opt/arcadeum
            exec node scripts/shorts-factory/factory.js
            WRAPPER
              sudo chmod +x /opt/arcadeum/scripts/shorts-factory-random.sh
              echo "Created shorts-factory-random.sh"
            fi

            echo "==> Restarting shorts-factory timer..."
            sudo systemctl restart shorts-factory.timer 2>/dev/null || true

            echo "==> Deploy complete"
