name: Deploy to OCI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/be/**'
      - 'apps/tg-bot/**'
      - 'packages/**'

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/arcadeum"
            cd "$DEPLOY_DIR"

            rm -f "$DEPLOY_DIR/.git/index.lock"

            git fetch origin main
            git reset --hard origin/main

            pnpm install --frozen-lockfile

            pnpm --filter @arcadeum/games-core build && pnpm --filter be build
            pnpm --filter tg-bot build

            pm2 delete arcadeum-be 2>/dev/null || true
            pm2 delete arcadeum-tg-bot 2>/dev/null || true
            pm2 start "$DEPLOY_DIR/apps/be/ecosystem.config.js"
            pm2 start "node bots/tg-bot/dist/src/main.js" --name arcadeum-tg-bot --cwd "$DEPLOY_DIR"
            pm2 save

            echo "==> Done!"
            pm2 list
