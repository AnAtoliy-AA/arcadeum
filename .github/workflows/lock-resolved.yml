name: Lock Resolved Issues

permissions: read-all

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  lock:
    name: Lock resolved issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: github.event.pull_request.merged == true
    steps:
      - name: Extract and lock linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ISSUES=$(echo "$PR_BODY" | grep -oE '(Closes|Fixes|Resolves) #([0-9]+)' | grep -oE '[0-9]+' || true)

          for ISSUE_NUM in $ISSUES; do
            echo "Locking issue #$ISSUE_NUM..."
            gh issue comment "$ISSUE_NUM" --body \
              "This issue has been locked because it was resolved by PR #${PR_NUMBER}." || true
            gh issue lock "$ISSUE_NUM" --reason resolved || true
          done
