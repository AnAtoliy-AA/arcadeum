name: Release

permissions: read-all

on:
  push:
    branches: [ main ]

env:
  NEXT_PUBLIC_E2E: 'true'
  E2E_PROD: 'true'
  NEXT_PUBLIC_AUTH_WEB_CLIENT_ID: dummy-client-id
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_PRESENTATION_VIDEO_ID: dQw4w9WgXcQ
  NEXT_PUBLIC_SOCIAL_LINKEDIN: https://linkedin.com/company/arcadeum
  NEXT_PUBLIC_SOCIAL_X: https://x.com/arcadeum
  NEXT_PUBLIC_SOCIAL_INSTAGRAM: https://instagram.com/arcadeum
  NEXT_PUBLIC_SOCIAL_DISCORD: https://discord.gg/arcadeum

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required to get full git history for auto-changelog

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm exec turbo run build --filter web --filter be

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: Run E2E Tests
        env:
          MONGODB_OCI_URI: mongodb://localhost:27017/arcadeum_test
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET || 'test_jwt_secret_key_for_e2e_only' }}
        run: pnpm --filter web test:e2e
