name: Social Posts

permissions: read-all

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for release post (e.g. v1.22.34). Leave empty for daily post on develop.'
        required: false
        type: string

jobs:
  daily-post:
    name: Daily Develop Changelog Poster
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && !inputs.tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Collect and format commits
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
          THREADS_ID: ${{ secrets.BUFFER_THREADS_ID }}
          LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          INSTAGRAM_ID: ${{ secrets.BUFFER_INSTAGRAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
        run: |
          python - <<'EOF'
          import subprocess
          import json
          import re

          try:
              raw_commits = subprocess.check_output(
                  ['git', 'log', 'origin/develop', '--since=24 hours ago', '--pretty=format:%s'],
                  text=True
              )
          except Exception as e:
              print(f"Error fetching logs: {e}")
              raw_commits = ""

          if not raw_commits.strip():
              print("No updates found in the last 24 hours. Skipping social posts.")
              exit(0)

          skip_patterns = [
              "Merge pull request",
              "Merge remote-tracking",
              "Merge branch",
              "chore: bump version",
              "chore: update changelog",
              "chore: start next minor",
              "resolve conflicts",
          ]

          type_emoji = {
              "feat": "✨",
              "fix": "🛠️",
              "refactor": "⚙️",
              "docs": "📚",
              "test": "🧪",
              "perf": "⚡",
              "style": "🎨",
              "chore": "🔧",
              "ci": "🔩",
              "build": "📦",
              "revert": "⏪",
          }

          clean_updates = []
          seen = set()
          for line in raw_commits.split('\n'):
              line = line.strip()
              if not line or any(p.lower() in line.lower() for p in skip_patterns) or line in seen:
                  continue
              seen.add(line)

              m = re.match(r'^(\w+)(?:\([^)]*\))?!?:', line)
              if m:
                  commit_type = m.group(1)
                  emoji = type_emoji.get(commit_type, "📝")
                  cleaned = re.sub(r'^\w+(?:\([^)]*\))?!?:\s*', f'{emoji} ', line)
              else:
                  cleaned = line
              clean_updates.append(f"- {cleaned}")

          if not clean_updates:
              print("No consumer-facing changes found today. Skipping.")
              exit(0)

          changelog_text = "\n".join(clean_updates[:15])
          with open('/tmp/changelog.txt', 'w') as f:
              f.write(changelog_text)
          print(f"Saved {len(clean_updates)} updates to /tmp/changelog.txt")
          EOF

      - name: Randomize posting time (0-2 hours)
        run: |
          SLEEP_SEC=$(( RANDOM % 7201 ))
          echo "Sleeping $SLEEP_SEC seconds before posting..."
          sleep "$SLEEP_SEC"
          echo "Done sleeping."

      - name: Post to socials
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
          THREADS_ID: ${{ secrets.BUFFER_THREADS_ID }}
          LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
        run: |
          python - <<'EOF'
          import json
          import os
          import random
          import requests
          import subprocess
          import time

          try:
              with open('/tmp/changelog.txt', 'r') as f:
                  changelog_text = f.read()
          except FileNotFoundError:
              print("No changelog file found. Skipping social posts.")
              exit(0)

          if not changelog_text.strip():
              print("Changelog is empty. Skipping social posts.")
              exit(0)

          try:
              full_version = subprocess.check_output(
                  ['python3', '-c', 'import json; print(json.load(open("apps/web/package.json"))["version"])'],
                  text=True
              ).strip()
              parts = full_version.split('.')
              app_version = f"{parts[0]}.{parts[1]}.~" if len(parts) >= 2 else full_version
          except Exception:
              app_version = "unknown"

          try:
              shared_intros = [
                  f"Daily Development Update!\n\nHere is what we added to develop — coming in release v{app_version}",
                  f"Fresh from the dev branch!\n\nNew additions landing in v{app_version}",
                  f"Ship log — day's work on develop for v{app_version}",
                  f"Dev update — here's what's cooking for v{app_version}",
                  f"Another day, more progress — heading to v{app_version}",
                  f"Built today, shipping soon — v{app_version} preview",
                  f"Behind the scenes — today's work toward v{app_version}",
                  f"Building in public — today on develop for v{app_version}",
                  f"Packed day on develop — landing in v{app_version}",
                  f"On track — here's what moved forward for v{app_version}",
                  f"Dev notes — what we pushed today for v{app_version}",
                  f"Daily build log — progress toward v{app_version}",
                  f"Code drop — today's commits for v{app_version}",
                  f"Rinse and repeat — more gains for v{app_version}",
                  f"Grinding away — today's output for v{app_version}",
                  f"Wrenches out — today's work on develop for v{app_version}",
                  f"Signal update — new from dev for v{app_version}",
                  f"Bolt by bolt — progress on develop for v{app_version}",
                  f"Scaffolding grows — today's work toward v{app_version}",
                  f"Live from the branch — updates for v{app_version}",
              ]
              shared_outros = [
                  "#buildinpublic #indiedev #gamedevelopment",
                  "#buildinpublic #indiedev #gamedevelopment #softwareengineering",
                  "#buildinpublic #indiedev #gamedevelopment #coding",
                  "#buildinpublic #indiedev #gamedevelopment #startup",
                  "#buildinpublic #indiedev #gamedevelopment #webdev",
                  "#buildinpublic #indiedev #gamedevelopment #tech",
                  "#buildinpublic #gamedevelopment #codinglife",
                  "#indiedev #gamedevelopment #buildinpublic #hustle",
                  "#gamedevelopment #buildinpublic #indiedev #grind",
                  "#buildinpublic #indiedev #gamedevelopment #madewithunity",
                  "#buildinpublic #indiedev #gamedev #coding",
                  "#buildinpublic #indiedev #softwareengineering #gamedev",
                  "#indiedev #gamedev #buildinpublic #daily",
                  "#gamedev #buildinpublic #indiedev #devlife",
                  "#buildinpublic #gamedev #indiedev #progress",
                  "#indiedev #gamedev #buildinpublic #shipit",
                  "#gamedev #buildinpublic #indiedev #makers",
                  "#buildinpublic #indiedev #gamedev #devupdate",
                  "#indiedev #gamedev #buildinpublic #code",
                  "#gamedev #buildinpublic #indiedev #wcw",
              ]
              shared_intros_out = [
                  f"Coming in release v{app_version} — stay tuned!",
                  f"Landing in v{app_version} soon",
                  f"Dropping in v{app_version}",
                  f"On the way in v{app_version}",
                  f"v{app_version} is shaping up",
                  f"More coming in v{app_version}",
                  f"Stay tuned for v{app_version}",
                  f"Watch it land in v{app_version}",
                  f"Building toward v{app_version}",
                  f"v{app_version} loading...",
                  f"Almost there — v{app_version}",
                  f"v{app_version} incoming",
                  f"Progressing toward v{app_version}",
                  f"v{app_version} getting closer",
                  f"One step closer to v{app_version}",
                  f"v{app_version} on the horizon",
                  f"Pipeline flowing to v{app_version}",
                  f"v{app_version} build in progress",
                  f"Trending toward v{app_version}",
                  f"v{app_version} milestones hit today",
              ]

              picks_intro = random.sample(shared_intros, 5)
              picks_outro = random.sample(shared_outros, 5)
              picks_footer = random.sample(shared_intros_out, 5)

              facebook_emoji_intros = ["🚀", "📡", "🔧", "⚙️", "🛠️", "💻", "🔩", "🏗️", "📦", "🎯", "📝", "🏗️", "💻", "🔄", "⚙️", "🛠️", "📡", "🔩", "🏗️", "📡"]
              facebook_emoji = random.choice(facebook_emoji_intros)
              facebook_header = f"{facebook_emoji} {picks_intro[0]}:\n\n"
              facebook_footer = f"\n\n{picks_outro[0]}"
              facebook_max = 63206

              facebook_chunks = []
              remaining = changelog_text
              while remaining:
                  budget = facebook_max - len(facebook_header) - len(facebook_footer) if not facebook_chunks else facebook_max
                  if len(remaining) <= budget:
                      facebook_chunks.append(remaining)
                      break
                  cut = remaining.rfind('\n', 0, budget)
                  if cut <= 0:
                      cut = budget
                  facebook_chunks.append(remaining[:cut])
                  remaining = remaining[cut:].lstrip('\n')

              facebook_texts = []
              for i, chunk in enumerate(facebook_chunks):
                  if i == 0:
                      facebook_texts.append(facebook_header + chunk + facebook_footer)
                  else:
                      facebook_texts.append(f"🚀 Daily Development Update (continued)\n\n{chunk}")

              threads_header = f"{picks_intro[1]}:\n\n"
              threads_footer = f"\n\n{picks_footer[1]} 🛠️"
              threads_max = 480

              threads_chunks = []
              remaining = changelog_text
              while remaining:
                  budget = threads_max - len(threads_header) - len(threads_footer) if not threads_chunks else threads_max
                  if len(remaining) <= budget:
                      threads_chunks.append(remaining)
                      break
                  cut = remaining.rfind('\n', 0, budget)
                  if cut <= 0:
                      cut = budget
                  threads_chunks.append(remaining[:cut])
                  remaining = remaining[cut:].lstrip('\n')

              threads_texts = []
              for i, chunk in enumerate(threads_chunks):
                  if i == 0:
                      threads_texts.append(threads_header + chunk + threads_footer)
                  else:
                      threads_texts.append(f"Added to develop (continued):\n\n{chunk}")

              linkedin_emoji_intros = ["🚀", "📡", "🔧", "⚙️", "🛠️", "🏗️", "📦", "🎯", "📝", "💻", "🔄", "⚙️", "📡", "🔩", "🏗️", "📡", "⚙️", "🔧", "🛠️", "💻"]
              linkedin_emoji = random.choice(linkedin_emoji_intros)
              linkedin_header = f"{linkedin_emoji} {picks_intro[2]}\n\n"
              linkedin_footer = f"\n\n{picks_outro[2]}"
              linkedin_max = 3000

              linkedin_chunks = []
              remaining = changelog_text
              while remaining:
                  budget = linkedin_max - len(linkedin_header) - len(linkedin_footer) if not linkedin_chunks else linkedin_max
                  if len(remaining) <= budget:
                      linkedin_chunks.append(remaining)
                      break
                  cut = remaining.rfind('\n', 0, budget)
                  if cut <= 0:
                      cut = budget
                  linkedin_chunks.append(remaining[:cut])
                  remaining = remaining[cut:].lstrip('\n')

              linkedin_texts = []
              for i, chunk in enumerate(linkedin_chunks):
                  if i == 0:
                      linkedin_texts.append(linkedin_header + chunk + linkedin_footer)
                  else:
                      linkedin_texts.append(f"🚀 Daily Development Update (continued)\n\n{chunk}")

              buffer_token = os.environ.get('BUFFER_API_TOKEN', '')
              if buffer_token:
                  buffer_url = "https://api.buffer.com"
                  headers = {
                      "Authorization": f"Bearer {buffer_token}",
                      "Content-Type": "application/json",
                  }

                  channels = [
                      (os.environ.get('FACEBOOK_ID', ''), facebook_texts, "Facebook", "facebook", "addToQueue"),
                      (os.environ.get('THREADS_ID', ''), threads_texts, "Threads", None, "shareNow"),
                      (os.environ.get('LINKEDIN_ID', ''), linkedin_texts, "LinkedIn", None, "shareNow"),
                  ]

                  for channel_id, texts, name, metadata_key, mode in channels:
                      if not channel_id:
                          print(f"Skipping Buffer post to {name} — channel ID not set")
                          continue
                      for i, text in enumerate(texts):
                          if metadata_key:
                              metadata_json = json.dumps({metadata_key: {"type": "post"}})
                          else:
                              metadata_json = "{}"
                          variables = {
                              "text": text,
                              "channelId": channel_id,
                              "metadata": json.loads(metadata_json),
                          }
                          query = """
                          mutation CreatePost($text: String!, $channelId: ChannelId!, $metadata: PostInputMetaData) {
                            createPost(input: {
                              text: $text
                              channelId: $channelId
                              schedulingType: automatic
                              mode: %s
                              assets: []
                              metadata: $metadata
                            }) {
                              ... on PostActionSuccess {
                                post { id text status }
                              }
                              ... on MutationError {
                                message
                              }
                            }
                          }
                          """ % mode
                          payload = {"query": query, "variables": variables}
                          resp = requests.post(buffer_url, headers=headers, json=payload)
                          if resp.status_code == 200:
                              result = resp.json()
                              if "errors" in result:
                                  print(f"Failed to post to {name}: {result['errors']}")
                              elif result.get("data", {}).get("createPost", {}).get("message"):
                                  print(f"Failed to post to {name}: {result['data']['createPost']['message']}")
                              else:
                                  suffix = f" (part {i + 1}/{len(texts)})" if len(texts) > 1 else ""
                                  print(f"Posted daily update to {name}{suffix}")
                          else:
                              print(f"Failed to post to {name}: {resp.text}")
              else:
                  print("BUFFER_API_TOKEN not set, skipping Buffer posts.")
          except Exception as e:
              print(f"Buffer posting failed: {e}")

          try:
              telegram_token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
              telegram_chat = os.environ.get('TELEGRAM_CHAT_ID', '')
              if telegram_token and telegram_chat:
                  tg_emojis = ["🚀", "📡", "🔧", "⚙️", "🛠️", "💻", "🔩", "🏗️", "📦", "🎯", "📝", "💻", "🔄", "⚙️", "📡", "🔩", "🏗️", "📡", "⚙️", "🔧"]
                  tg_emoji = random.choice(tg_emojis)
                  tg_header = f"{tg_emoji} <b>{picks_intro[3]}</b>:\n\n"
                  tg_footer = f"\n\n{picks_footer[3]}!"
                  tg_max = 4096

                  def escape_html(text):
                      return text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

                  tg_lines = [f"<b>{escape_html(line)}</b>" if line.startswith('- ') else escape_html(line) for line in changelog_text.split('\n') if line.strip()]
                  tg_body = "\n".join(tg_lines)

                  tg_chunks = []
                  remaining = tg_body
                  while remaining:
                      budget = tg_max - len(tg_header) - len(tg_footer) if not tg_chunks else tg_max
                      if len(remaining) <= budget:
                          tg_chunks.append(remaining)
                          break
                      cut = remaining.rfind('\n', 0, budget)
                      if cut <= 0:
                          cut = budget
                      tg_chunks.append(remaining[:cut])
                      remaining = remaining[cut:].lstrip('\n')

                  for i, chunk in enumerate(tg_chunks):
                      if i == 0:
                          tg_text = tg_header + chunk + tg_footer
                      else:
                          tg_text = f"🚀 <b>Daily Development Update (continued)</b>\n\n{chunk}"
                      tg_resp = requests.post(
                          f"https://api.telegram.org/bot{telegram_token}/sendMessage",
                          data={"chat_id": telegram_chat, "text": tg_text, "parse_mode": "HTML"},
                      )
                      if tg_resp.status_code == 200:
                          print(f"Posted daily update to Telegram (part {i + 1}/{len(tg_chunks)})")
                      else:
                          print(f"Failed to post to Telegram: {tg_resp.text}")
                      if i < len(tg_chunks) - 1:
                          time.sleep(1)
              else:
                  print("Telegram not configured, skipping.")
          except Exception as e:
              print(f"Telegram posting failed: {e}")

          try:
              discord_webhook = os.environ.get('DISCORD_WEBHOOK_DAILY', '')
              if discord_webhook:
                  dc_emojis = ["🚀", "📡", "🔧", "⚙️", "🛠️", "💻", "🔩", "🏗️", "📦", "🎯", "📝", "💻", "🔄", "⚙️", "📡", "🔩", "🏗️", "📡", "⚙️", "🔧"]
                  dc_emoji = random.choice(dc_emojis)
                  header = f"## {dc_emoji} {picks_intro[4]}\n\n"
                  footer = f"\n\n{picks_footer[4]}!"
                  max_len = 2000

                  chunks = []
                  remaining = changelog_text
                  while remaining:
                      budget = max_len - len(header) - len(footer) if not chunks else max_len
                      if len(remaining) <= budget:
                          chunks.append(remaining)
                          break
                      cut = remaining.rfind('\n', 0, budget)
                      if cut <= 0:
                          cut = budget
                      chunks.append(remaining[:cut])
                      remaining = remaining[cut:].lstrip('\n')

                  for i, chunk in enumerate(chunks):
                      if i == 0:
                          content = header + chunk + footer
                      else:
                          content = f"## 🚀 Daily Development Update (continued)\n\n{chunk}\n\n{footer}"
                      dc_resp = requests.post(
                          discord_webhook,
                          json={"content": content},
                      )
                      if dc_resp.status_code in (200, 204):
                          print(f"Posted daily update to Discord (part {i + 1}/{len(chunks)})")
                      else:
                          print(f"Failed to post to Discord: {dc_resp.text}")
              else:
                  print("Discord webhook not configured, skipping.")
          except Exception as e:
              print(f"Discord posting failed: {e}")

          EOF

  release-post:
    name: Release Social Poster
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Gather Release Changes and Post
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
          THREADS_ID: ${{ secrets.BUFFER_THREADS_ID }}
          LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          INSTAGRAM_ID: ${{ secrets.BUFFER_INSTAGRAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
        run: |
          python - <<'EOF'
          import json
          import os
          import subprocess
          import random
          import requests

          INPUT_TAG = '${{ github.event.inputs.tag }}'
          if INPUT_TAG:
              tag = INPUT_TAG.strip()
              print(f"Using manually specified tag: {tag}")
          else:
              try:
                  tag = subprocess.check_output(
                      ['git', 'describe', '--tags', '--abbrev=0'],
                      text=True
                  ).strip()
              except Exception:
                  print("No tags found. Skipping release post.")
                  exit(0)

          version = tag.lstrip('v')
          prod_url = "https://arcadeum.games"

          try:
              shared_release_intros = [
                  f"Release v{version} is live!",
                  f"v{version} just dropped!",
                  f"We shipped v{version}!",
                  f"Fresh out of the oven — v{version}",
                  f"v{version} has arrived!",
                  f"And just like that — v{version} is out!",
                  f"Pushed to prod — v{version} is here!",
                  f"v{version} is officially live!",
                  f"Another one! v{version} is out now",
                  f"Hot off the press — v{version}",
                  f"v{version} — live and kicking!",
                  f"We just hit deploy on v{version}!",
                  f"v{version} is out — go check it out!",
                  f"Release v{version} just landed!",
                  f"Stable and shipped — v{version}",
                  f"v{version} is production-ready!",
                  f"Out the door — v{version} is live!",
                  f"v{version} — deployed and ready!",
                  f"Fresh release v{version} is here!",
                  f"Version v{version} — out now!",
              ]
              shared_release_outros = [
                  f"Try it out at arcadeum.games",
                  f"Dive in now at arcadeum.games",
                  f"Play it here at arcadeum.games",
                  f"Check it out at arcadeum.games",
                  f"Jump in at arcadeum.games",
                  f"Play free at arcadeum.games",
                  f"Head to arcadeum.games and try it!",
                  f"Experience it at arcadeum.games",
                  f"Go play at arcadeum.games",
                  f"Available now at arcadeum.games",
                  f"Start playing at arcadeum.games",
                  f"Try it free at arcadeum.games",
                  f"Play now at arcadeum.games",
                  f"See what's new at arcadeum.games",
                  f"Hop in at arcadeum.games",
                  f"Live at arcadeum.games — try it!",
                  f"Check the update at arcadeum.games",
                  f"Ready to play? Head to arcadeum.games",
                  f"New release, live now at arcadeum.games",
                  f"Go explore it at arcadeum.games",
              ]

              picks_intro = random.sample(shared_release_intros, 5)
              picks_outro = random.sample(shared_release_outros, 5)

              fb_emojis = ["🚀", "🎉", "🔥", "✨", "🎯", "🏁", "⚡", "👀", "🛬", "✅", "🏭", "🚪", "🎮", "🌟", "📦", "🚀", "🎉", "🔥", "✨", "🎯"]
              facebook_text = f"{random.choice(fb_emojis)} {picks_intro[0]}!\n\n{picks_outro[0]}\n\n#arcadeum #gamedev #newrelease #boardgames"

              threads_emojis = ["🚀", "🎉", "🔥", "⚡", "✨", "🎯", "🏁", "📦", "🛬", "🏭", "✅", "🌟", "🎮", "🚀", "🎉", "🔥", "⚡", "✨", "🎯", "🏁"]
              threads_text = f"{picks_intro[1]} {random.choice(threads_emojis)}\n\n{picks_outro[1]}"

              li_emojis = ["🚀", "🎉", "✨", "🎯", "🏁", "🔥", "⚡", "👀", "🛬", "✅", "🏭", "🚪", "🎮", "🌟", "📦", "🚀", "🎉", "🔥", "✨", "🎯"]
              linkedin_text = f"{random.choice(li_emojis)} {picks_intro[2]}!\n\n{picks_outro[2]}\n\n#gamedev #newrelease #boardgames #indiegame"

              buffer_token = os.environ.get('BUFFER_API_TOKEN', '')
              if buffer_token:
                  buffer_url = "https://api.buffer.com"
                  headers = {
                      "Authorization": f"Bearer {buffer_token}",
                      "Content-Type": "application/json",
                  }

                  channels = [
                      (os.environ.get('FACEBOOK_ID', ''), facebook_text, "Facebook", "facebook", "addToQueue"),
                      (os.environ.get('THREADS_ID', ''), threads_text, "Threads", "threads", "shareNow"),
                      (os.environ.get('LINKEDIN_ID', ''), linkedin_text, "LinkedIn", None, "shareNow"),
                  ]

                  for channel_id, text, name, platform, mode in channels:
                      if not channel_id:
                          print(f"Skipping Buffer post to {name} — channel ID not set")
                          continue
                      if platform:
                          metadata_json = json.dumps({platform: {"type": "post"}})
                      else:
                          metadata_json = "{}"
                      variables = {
                          "text": text,
                          "channelId": channel_id,
                          "metadata": json.loads(metadata_json),
                      }
                      query = """
                      mutation CreatePost($text: String!, $channelId: ChannelId!, $metadata: PostInputMetaData) {
                        createPost(input: {
                          text: $text
                          channelId: $channelId
                          schedulingType: automatic
                          mode: %s
                          assets: []
                          metadata: $metadata
                        }) {
                          ... on PostActionSuccess {
                            post { id text status }
                          }
                          ... on MutationError {
                            message
                          }
                        }
                      }
                      """ % mode
                      payload = {"query": query, "variables": variables}
                      resp = requests.post(buffer_url, headers=headers, json=payload)
                      if resp.status_code == 200:
                          result = resp.json()
                          if "errors" in result:
                              print(f"Failed to post to {name}: {result['errors']}")
                          elif result.get("data", {}).get("createPost", {}).get("message"):
                              print(f"Failed to post to {name}: {result['data']['createPost']['message']}")
                          else:
                              print(f"Posted release v{version} to {name}")
                      else:
                          print(f"Failed to post to {name}: {resp.text}")
              else:
                  print("BUFFER_API_TOKEN not set, skipping Buffer posts.")
          except Exception as e:
              print(f"Buffer posting failed: {e}")

          try:
              telegram_token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
              telegram_chat = os.environ.get('TELEGRAM_CHAT_ID', '')
              if telegram_token and telegram_chat:
                  tg_emojis = ["🚀", "🎉", "✨", "🎯", "🔥", "🏁", "⚡", "👀", "🛬", "✅", "🏭", "🚪", "🎮", "🌟", "📦", "🚀", "🎉", "🔥", "✨", "🎯"]
                  tg_text = f"{random.choice(tg_emojis)} <b>{picks_intro[3]}!</b>\n\n{picks_outro[3]}"

                  tg_resp = requests.post(
                      f"https://api.telegram.org/bot{telegram_token}/sendMessage",
                      data={"chat_id": telegram_chat, "text": tg_text, "parse_mode": "HTML"},
                  )
                  if tg_resp.status_code == 200:
                      print(f"Posted release v{version} to Telegram")
                  else:
                      print(f"Failed to post to Telegram: {tg_resp.text}")
              else:
                  print("Telegram not configured, skipping.")
          except Exception as e:
              print(f"Telegram posting failed: {e}")

          try:
              discord_webhook = os.environ.get('DISCORD_WEBHOOK_RELEASE', '')
              if discord_webhook:
                  dc_emojis = ["🚀", "🎉", "✨", "🎯", "🔥", "🏁", "⚡", "👀", "🛬", "✅", "🏭", "🚪", "🎮", "🌟", "📦", "🚀", "🎉", "🔥", "✨", "🎯"]
                  content = f"## {random.choice(dc_emojis)} {picks_intro[4]}!\n\n{picks_outro[4]}"

                  dc_resp = requests.post(
                      discord_webhook,
                      json={"content": content},
                  )
                  if dc_resp.status_code in (200, 204):
                      print(f"Posted release v{version} to Discord")
                  else:
                      print(f"Failed to post to Discord: {dc_resp.text}")
              else:
                  print("Discord webhook not configured, skipping.")
          except Exception as e:
              print(f"Discord posting failed: {e}")

          EOF
