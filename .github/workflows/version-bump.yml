name: Version Bump & Changelog

permissions: read-all

on:
  push:
    branches: [ develop, main ]

jobs:
  bump-version:
    # Never re-bump the version for our own bump commit (prevents an infinite loop).
    # We must NOT use [skip ci] here: a [skip ci] head commit suppresses all
    # pull_request workflows for release PRs (develop -> staging/main), leaving
    # required checks like check-pr-title in "Expected" state forever.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump version') && !startsWith(github.event.head_commit.message, 'chore: start next minor version') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Needed for git describe

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Calculate and apply version bump
        shell: bash
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          # A push to main means a release just landed. The next-minor bump
          # must land on develop (main keeps the released version, develop
          # continues as 1.26.x). Base the bump on develop's head instead of
          # main's checkout so the push below is always a fast-forward — even
          # when develop moved past the release cut while the release PRs
          # were in review.
          if [[ "$BRANCH_NAME" == "main" ]]; then
            git fetch origin develop
            git checkout -B bump-base origin/develop
          fi

          CURRENT_VERSION=$(node -p "require('./apps/web/package.json').version")

          echo "Current Version: $CURRENT_VERSION"
          echo "Branch: $BRANCH_NAME"
          
          if [[ "$BRANCH_NAME" == "main" ]]; then
            # Minor bump: 1.23.4 -> 1.24.0
            NEW_VERSION=$(node -p "const v = '$CURRENT_VERSION'.split('.'); v[1]++; v[2]=0; v.join('.')")
            COMMIT_MSG="chore: start next minor version v${NEW_VERSION}"
          else
            # Patch bump: 1.23.4 -> 1.23.5
            NEW_VERSION=$(node -p "const v = '$CURRENT_VERSION'.split('.'); v[2]++; v.join('.')")
            COMMIT_MSG="chore: bump version to v${NEW_VERSION} and update changelog"
          fi
          
          # If tag already exists on remote, auto-increment patch until we find a free version
          while git ls-remote --tags origin "refs/tags/v$NEW_VERSION" | grep -q "refs/tags/v$NEW_VERSION"; do
            echo "Tag v$NEW_VERSION already exists on remote, bumping patch"
            NEW_VERSION=$(node -p "const v = '$NEW_VERSION'.split('.'); v[2]++; v.join('.')")
          done
          
          echo "New Version: $NEW_VERSION"
          echo "Commit Message: $COMMIT_MSG"
          
          # Apply to all package.json files
          find . -name "package.json" -not -path "*/node_modules/*" | while read -r pkg; do
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('$pkg','utf8')); p.version='$NEW_VERSION'; fs.writeFileSync('$pkg', JSON.stringify(p,null,2)+'\n')"
          done
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          chmod +x scripts/generate_changelog.sh
          # CURRENT_VERSION and IS_RELEASE are already in the environment from the previous step
          ./scripts/generate_changelog.sh

      - name: Commit and Push Changes
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Stage changes
          find . -name "package.json" -not -path "*/node_modules/*" -exec git add {} +
          git add CHANGELOG.md
          
          git commit -m "$COMMIT_MSG"
          
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          # Push with retry — develop may have moved while we were bumping.
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            git push origin HEAD:develop && break
            echo "Push failed (attempt $i/$MAX_RETRIES), pulling and retrying..."
            git pull --rebase origin develop
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi
          done
          git push origin "v$NEW_VERSION"

