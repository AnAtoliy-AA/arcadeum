<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#030c14"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>

  <g transform="translate(200,105)">
    <!-- Stack of cascade cards -->
    <rect x="-36" y="-36" width="40" height="56" rx="5" fill="#f43f5e" stroke="#f8fafc" stroke-width="2" transform="rotate(-15)"/>
    <rect x="-20" y="-38" width="40" height="56" rx="5" fill="#3b82f6" stroke="#f8fafc" stroke-width="2" transform="rotate(-5)"/>
    <rect x="-4" y="-36" width="40" height="56" rx="5" fill="#10b981" stroke="#f8fafc" stroke-width="2" transform="rotate(8)"/>
    <rect x="12" y="-32" width="40" height="56" rx="5" fill="#f59e0b" stroke="#f8fafc" stroke-width="2" transform="rotate(20)"/>
  </g>

  <text x="200" y="202" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="28" font-weight="900" letter-spacing="6" fill="url(#title)">CASCADE</text>
</svg>
