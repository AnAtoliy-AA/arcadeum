<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#2d2218"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="blackStone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- Go Goban Grid -->
  <g transform="translate(200,105)">
    <g stroke="#d97706" stroke-width="1.5" opacity="0.45">
      <line x1="-54" y1="-54" x2="54" y2="-54"/>
      <line x1="-54" y1="-18" x2="54" y2="-18"/>
      <line x1="-54" y1="18" x2="54" y2="18"/>
      <line x1="-54" y1="54" x2="54" y2="54"/>
      <line x1="-54" y1="-54" x2="-54" y2="54"/>
      <line x1="-18" y1="-54" x2="-18" y2="54"/>
      <line x1="18" y1="-54" x2="18" y2="54"/>
      <line x1="54" y1="-54" x2="54" y2="54"/>
    </g>

    <!-- Star points -->
    <circle cx="-18" cy="-18" r="2.5" fill="#d97706" opacity="0.7"/>
    <circle cx="18" cy="18" r="2.5" fill="#d97706" opacity="0.7"/>

    <!-- Stones -->
    <circle cx="-18" cy="-18" r="16" fill="url(#blackStone)"/>
    <circle cx="18" cy="-18" r="16" fill="url(#whiteStone)"/>
    <circle cx="-18" cy="18" r="16" fill="url(#whiteStone)"/>
    <circle cx="18" cy="18" r="16" fill="url(#blackStone)"/>
    <circle cx="54" cy="-18" r="16" fill="url(#blackStone)"/>
  </g>

  <text x="200" y="202" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="28" font-weight="900" letter-spacing="6" fill="url(#title)">GO</text>
</svg>
