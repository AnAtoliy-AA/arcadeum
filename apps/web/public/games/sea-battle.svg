<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f2b46"/>
      <stop offset="100%" stop-color="#040d16"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>

  <g transform="translate(200,105)">
    <!-- Radar circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>

    <!-- Battleship silhouette -->
    <path d="M-40 8 L-30 18 H32 L44 8 L30 4 H-26 Z" fill="#38bdf8" opacity="0.9"/>
    <rect x="-18" y="-6" width="28" height="10" fill="#0284c7"/>
    <rect x="-8" y="-14" width="10" height="8" fill="#38bdf8"/>
    <line x1="4" y1="-10" x2="18" y2="-10" stroke="#bae6fd" stroke-width="2.5"/>

    <!-- Crosshair target -->
    <circle cx="18" cy="-10" r="12" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>
  </g>

  <text x="200" y="202" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="26" font-weight="900" letter-spacing="4" fill="url(#title)">SEA BATTLE</text>
</svg>
