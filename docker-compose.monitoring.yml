# Monitoring stack for Arcadeum
# Run alongside the main compose stack:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Grafana: http://<server-ip>:3001
# Prometheus: http://<server-ip>:9090

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: arcadeum-prometheus
    restart: unless-stopped
    ports:
      - '0.0.0.0:9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - arcadeum

  grafana:
    image: grafana/grafana:latest
    container_name: arcadeum-grafana
    restart: unless-stopped
    ports:
      - '0.0.0.0:3001:3000'
    env_file:
      - ./monitoring/.env.monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-arcadeum}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/var/lib/grafana/dashboards/arcadeum-be.json'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - arcadeum

volumes:
  prometheus-data:
  grafana-data:

networks:
  arcadeum:
    external: true
