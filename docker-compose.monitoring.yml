# Monitoring stack for Arcadeum
# Run alongside the main compose stack:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Access via SSH tunnel (ports are localhost-only for security):
#   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 user@oci-ip
# Then open:
#   Grafana: http://localhost:3001 (admin / FlOBWsmqZp/D1le679kzzA==)
#   Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: arcadeum-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - arcadeum

  grafana:
    image: grafana/grafana:latest
    container_name: arcadeum-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'
    env_file:
      - ./monitoring/.env.monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/var/lib/grafana/dashboards/arcadeum-be.json'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - arcadeum

volumes:
  prometheus-data:
  grafana-data:

networks:
  arcadeum:
    external: true
