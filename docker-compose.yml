services:
  redis:
    image: redis:7-alpine
    container_name: arcadeum-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: arcadeum-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  be:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    container_name: arcadeum-be-1
    restart: unless-stopped
    env_file:
      - ./apps/be/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - '4000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  be-2:
    build:
      context: .
      dockerfile: apps/be/Dockerfile
    container_name: arcadeum-be-2
    restart: unless-stopped
    env_file:
      - ./apps/be/.env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - '4000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: arcadeum-nginx
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - be
      - be-2
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/be/Dockerfile.worker
    container_name: arcadeum-worker
    restart: unless-stopped
    env_file:
      - ./apps/be/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  tg-bot:
    build:
      context: .
      dockerfile: apps/tg-bot/Dockerfile
    container_name: arcadeum-tg-bot
    restart: unless-stopped
    env_file:
      - ./apps/tg-bot/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4001:4001'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
  redis-data:

networks:
  arcadeum:
