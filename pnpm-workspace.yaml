packages:
  - apps/*
  - packages/*

# pnpm settings. Kept here, not in the package.json "pnpm" field or .npmrc:
# pnpm >=11 no longer reads those (and warns on every run).
shamefullyHoist: true
dedupePeerDependents: true

# Security / compatibility pins for transitive dependencies.
overrides:
  'shell-quote': '>=1.9.0'
  'handlebars': '>=4.7.9'
  'tar': '>=7.5.19'
  'node-forge': '>=1.4.0'
  'nanoid@<3.3.18': '3.3.18'
  'serialize-javascript@<7.0.5': '>=7.0.5'
  'ts-deepmerge@<8.0.0': '>=8.0.0'
  'joi@<17.13.4': '>=17.13.4 <18'
  'uuid@<11.1.1': '>=11.1.1 <12'
  '@xmldom/xmldom@<0.8.13': '>=0.8.13 <0.9'
  'yaml@<2.8.3': '>=2.8.3 <3'
  'minimatch@>=5.0.0 <5.1.8': '>=5.1.8 <6'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '>=8.18.0 <9'
  'diff@>=6.0.0 <8.0.3': '>=8.0.3 <9'
  'stream-json@<3.5.0': '>=3.5.0 <4'
  'decode-uri-component@<0.5.0': '>=0.5.0 <1'

# Dependencies allowed to run install scripts (pnpm >=10 skips install
# scripts of any dependency not listed here).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - bcrypt
  - bigint-buffer
  - bufferutil
  - esbuild
  - mongodb-memory-server
  - msgpackr-extract
  - protobufjs
  - unrs-resolver
  - utf-8-validate
# Only a donation banner / an optional DTrace probe for bunyan: not needed.
ignoredBuiltDependencies:
  - core-js
  - dtrace-provider
